services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: aula-s98-www:latest
    container_name: aula-s98-www
    ports:
      - "${WWW_PORT:-8098}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
