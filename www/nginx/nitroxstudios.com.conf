# Host nginx reverse-proxy for nitroxstudios.com/aula → aula-s98-www (Docker :8098)
# Install: sudo bash www/ci/setup-host-nginx.sh
#
# Container serves the site under /aula/; host proxies the full path (no strip).
# GitHub webhook → local listener :9001

server {
    listen 80;
    listen [::]:80;
    server_name nitroxstudios.com www.nitroxstudios.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ^~ /hooks/github/aula-www {
        proxy_pass http://127.0.0.1:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
        proxy_read_timeout 30s;
    }

    location /aula/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
