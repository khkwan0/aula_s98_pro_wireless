server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SEO / security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Site is published at /aula/ (host nginx proxies the full path here)
    location = /aula {
        return 301 /aula/;
    }

    location = / {
        return 301 /aula/;
    }

    # Long-cache static assets under /aula/
    location ~* ^/aula/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /aula/robots.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /aula/sitemap.xml {
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location /aula/ {
        try_files $uri $uri/ =404;
    }

    error_page 404 /aula/404.html;
    location = /aula/404.html {
        internal;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;
}
